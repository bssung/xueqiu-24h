name: Xueqiu 24h Fetch

on:
  workflow_dispatch:
  schedule:
    # every 2 hours UTC (Beijing 08:00/10:00/.../22:00)
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  fetch-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch last-24h posts
        run: node scripts/crawl_xueqiu_24h.js

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xueqiu/
          git diff --cached --quiet || git commit -m "chore: xueqiu 24h fetch"
          git push
